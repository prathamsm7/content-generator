[project]
name = "repurposely"
version = "0.1.0"
description = "FastAPI backend for YouTube-to-content repurposing."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.115.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=1.2.1",
    "langgraph>=1.1.10",
    "pydantic-settings>=2.0.0",
    "uvicorn[standard]>=0.32.0",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.3.17",
]
